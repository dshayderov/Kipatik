<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Значок вкладки — тот же логотип на тёмной подложке: сам логотип
         белый, и на светлой вкладке был бы не виден вовсе. Раньше здесь
         стояла ссылка на /vite.svg, которого в проекте нет, поэтому иконка
         не отдавалась вовсе. -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kipatik</title>
    <!-- Прямое подключение Tailwind для гарантии отображения стилей -->

    <script>

        theme: {
          extend: {
            colors: {
              gh: {
                bg: '#f6f8fa',
                border: '#d0d7de',
                text: '#1f2328',
                secondary: '#636c76',
                link: '#0969da',
                success: '#1f883d',
              }
            }
          }
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
